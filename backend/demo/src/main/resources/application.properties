# ===============================
# = SERVER CONFIGURATION
# ===============================
server.port=8080

# ===============================
# = DATABASE CONFIGURATION (Neon PostgreSQL)
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# Enable SSL for Neon (required)
spring.datasource.hikari.data-source-properties.sslmode=require

# ===============================
# = JPA / HIBERNATE SETTINGS
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# = LOGGING
# ===============================
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===============================
# = CONNECTION POOL (HikariCP)
# ===============================
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=HikariPool-1

# ===============================
# = OPTIONAL: APP INFO
# ===============================
spring.application.name=PetServicePlatform

#=====
# = cloduinary config
#=====
cloudinary.cloud_name=${cloud_name}
cloudinary.api_key=${api_key}
cloudinary.api_secret=${api_secret}

#=====
# = JWT Configuration
#=====
# IMPORTANT: Set this to match your better-auth JWT secret
# You can find this in your better-auth configuration or environment variables
jwt.secret=${JWT_SECRET:your-secret-key-change-this-in-production-min-256-bits-required-for-security}
jwt.expiration=86400000


logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG